[workspace]
members = ["crates/silta", "crates/siltad", "crates/silta-claude", "crates/silta-session"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/dmitry-markin/silta"

[workspace.dependencies]
silta = { path = "crates/silta" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
matrix-sdk = { version = "0.18", features = ["markdown", "bundled-sqlite"] }
mime_guess = "2"
nix = { version = "0.30", features = ["user", "hostname"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.2", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
