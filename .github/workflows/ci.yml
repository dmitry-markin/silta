# CI: formatting, lints and tests on every push and PR, plus the Debian package build
# on the same Debian release the deployment guide recommends.
#
# `--locked` everywhere makes a stale Cargo.lock fail instead of being silently rewritten.
#
# Third-party actions are pinned to commit SHAs, since tags can be moved; Dependabot
# (.github/dependabot.yml) opens PRs to bump the pins.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Caches ~/.cargo (registry, git checkouts) and the dependency artifacts in target/
      # across runs, keyed on Cargo.lock and the toolchain. The workspace crates themselves
      # are always rebuilt. shared-key replaces the default per-job key so check and clippy
      # restore and save the same entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check

      - run: cargo check --workspace --all-targets --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test --workspace --locked

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two rustfmts: stable is what contributors run, and a pinned nightly adds the
      # comment-width check, since `wrap_comments` is unstable. The nightly is the last one
      # before the 1.98 beta branch, so its rustfmt is the source stable 1.98 shipped; it
      # was verified to format this tree identically to stable. If the two ever disagree,
      # this job goes red with a diff, and the pin needs moving to the current stable's
      # branch point (the last nightly whose rustc still carries stable's version number).
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup toolchain install nightly-2026-07-05 --profile minimal --component rustfmt

      - name: cargo fmt (stable)
        run: cargo fmt --all --check

      - name: cargo fmt (nightly, comment width)
        run: cargo +nightly-2026-07-05 fmt --all --check -- --config wrap_comments=true,comment_width=100

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  contract-check-format:
    name: contract checker format
    runs-on: ubuntu-latest
    # black at 100 columns and pycodestyle without the two codes black's style trips (E203,
    # W503), from a venv (the runner's Python is externally managed) with every package
    # pinned by hash in dev/contract-check-format-requirements.txt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install --require-hashes -r dev/contract-check-format-requirements.txt

      - run: '"$RUNNER_TEMP/format/bin/black" --check --line-length 100 deploy/silta-contract-check'

      - run: '"$RUNNER_TEMP/format/bin/pycodestyle" --max-line-length 100 --ignore E203,W503 deploy/silta-contract-check'

  contract-check:
    name: contract check replay
    runs-on: ubuntu-latest
    # The checker itself needs a Claude Code and a login, so CI runs its assertions over a
    # recorded trace instead: this keeps the script's parsing and checks working, not the
    # contract, which only a live run on the VM or a developer's machine can check. The
    # script is stdlib-only, so the runner's python3 is all it needs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: deploy/silta-contract-check --replay dev/contract-fixtures/2.1.283

  deb:
    name: build-deb.sh (Debian 13)
    runs-on: ubuntu-latest
    container: debian:13
    # The release profile's fat LTO with one codegen unit is a single-threaded link of
    # several minutes per binary, which made this job take ten minutes against one for the
    # rest. This job checks that the package builds and is assembled right, not the binary
    # that gets deployed (docs/deployment.md builds that on the VM with the real profile),
    # so the two settings are overridden here and the .deb artifact is not the shipped one.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      # The same packages docs/deployment.md tells the operator to install, plus what the
      # actions need inside a bare container: git for checkout, curl and CA certificates
      # for rustup. build-essential brings dpkg-dev, which cargo-deb needs for `$auto`.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A bare container has no Rust: install it the way docs/deployment.md tells the
      # operator to, with the official rustup installer.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # cache-bin (on by default) also keeps ~/.cargo/bin, so cargo-deb is only compiled
      # again when the cache key changes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deb
        run: command -v cargo-deb || cargo install --locked cargo-deb

      - name: Build the package
        run: ./build-deb.sh

      - name: Inspect the package
        run: |
          deb=$(ls target/debian/silta_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silta-deb
          path: target/debian/silta_*_amd64.deb
          retention-days: 7
          if-no-files-found: error
