name: Bug report
description: Something is not working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, search the existing issues. If yours is already there, add a comment with your specifics instead of a new report.

        Only bug reports for the latest released Silta version and the Claude Code version its README names are accepted.
  - type: input
    id: silta-version
    attributes:
      label: Silta version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      placeholder: "2.1.283"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the issue
      description: What happened, what you expected, and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Relevant lines from the journal
      description: Paste the lines as a code block when under 50, or drag the file into this field when above.
      placeholder: |
        ```
        Sep 28 17:00:00 host silta-session[1234]: ...
        ```
    validations:
      required: true
  - type: textarea
    id: contract-check
    attributes:
      label: silta-contract-check report
      description: Drag in the report generated by `sudo systemctl start silta-contract-check` on the deployment. See [docs/deployment.md](https://github.com/dmitry-markin/silta/blob/master/docs/deployment.md#installing-an-untested-version) for the setup.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues
          required: true
        - label: This issue affects the latest released Silta version with the matching Claude Code version
          required: true
        - label: I have attached the report generated by `silta-contract-check`
          required: true
        - label: I have pasted or attached the relevant journal lines
          required: true
