# siltad configuration for development against the loopback conduit on this host.
# Copy to dev/siltad.toml (gitignored), fill in the password, use absolute paths.

socket    = "/ABSOLUTE/PATH/TO/silta/dev/state/siltad.sock"
state_dir = "/ABSOLUTE/PATH/TO/silta/dev/state/silta"
replay_window_secs = 7200  # optional (default 300); how long a message waits for its session, or is
                           # replayed after a daemon restart, before it is dropped. Two hours for
                           # production (2026-09-06): gaps there are unattended, and a late answer
                           # beats a dropped message
inbox_max_age_days = 30    # optional; a session's plugin deletes received files older than this
attachment_max_mb  = 100   # optional; larger attachments are not downloaded or accepted

[matrix]
homeserver_url = "http://localhost"
user_id        = "@silta:localhost"
password       = "..."             # used only when state_dir/session.json is absent
device_id      = "silta"
device_name    = "Silta"

[[people]]
name = "Bob"
role = "owner"
addresses = ["@bob:localhost"]

[[people]]
name = "Alice"
role = "family"
addresses = ["@alice:localhost"]

# One session per person, the hub for group rooms. `user` is the Unix user the
# session's plugin connects as; the daemon refuses any other.
[[sessions]]
name = "hub"
receive = "groups"
send = "own"
user = "bob"

[[sessions]]
name = "bob"
receive = { people = ["Bob"] }
user = "bob"

[[sessions]]
name = "alice"
receive = { people = ["Alice"] }
user = "silta-alice"
