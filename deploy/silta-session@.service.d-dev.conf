# Drop-in for the development host (myhost), installed as
# /etc/systemd/system/silta-session@.service.d/dev.conf: the daemon runs from the
# repository as the developer's user, and the binaries are the repository's builds.
[Unit]
Wants=
After=network-online.target

[Service]
Environment=SILTA_SOCKET=/home/bob/silta/dev/state/siltad.sock
Environment=SILTA_PERSONA=/home/bob/silta/assistant/persona.md
Environment=SILTA_CLAUDE_BIN=/home/bob/silta/target/release/silta-claude
Environment=CLAUDE_BIN=/home/bob/.local/bin/claude
ExecStart=
ExecStart=/home/bob/silta/deploy/silta-session
